version: '3.8'

services:
  querocomprar:
    image: querocomprar:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: querocomprar
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=production
      - PORT=3333
      - DATABASE_URL=/app/data/quero_comprar.db
    volumes:
      - /DATA/AppData/querocomprar:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
    x-casaos:
      architectures:
        - amd64
        - arm64
      main: querocomprar
      author: ApenasGabs
      category: Utilities
      description:
        en_us: Autonomous price tracking and smart wishlist with anti-outlier filters.
        pt_br: Sistema autônomo local de monitoramento de preços e wishlist inteligente com proteção contra falsos descontos.
      developer: ApenasGabs
      icon: https://raw.githubusercontent.com/ApenasGabs/querocomprar/main/public/icon.svg
      index: /
      port_map: "3333"
      scheme: http
      title:
        en_us: Quero Comprar
        pt_br: Quero Comprar
